name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: >-
          python -m pytest -q
          --cov=api --cov=core --cov=memory --cov=tools
          --cov-report=term-missing --cov-report=xml --cov-fail-under=40

      - name: Compile source
        run: >-
          python -m compileall -q api.py config.py core memory tools main.py tests evals